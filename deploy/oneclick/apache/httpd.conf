# IFShare standalone Apache instance. Existing nginx/apache sites are untouched.
# This file is preserved on reinstallation. Runtime parameters are generated separately.
ServerRoot /etc/ifshare/apache
Include /etc/ifshare/apache/runtime.conf
DefaultRuntimeDir /run/ifshare-web
PidFile /run/ifshare-web/apache.pid
Listen ${IFSHARE_WEB_PORT} https
ServerName ${IFSHARE_HOST}:${IFSHARE_WEB_PORT}

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule auth_form_module /usr/lib/apache2/modules/mod_auth_form.so
LoadModule request_module /usr/lib/apache2/modules/mod_request.so
LoadModule session_module /usr/lib/apache2/modules/mod_session.so
LoadModule session_cookie_module /usr/lib/apache2/modules/mod_session_cookie.so
LoadModule session_crypto_module /usr/lib/apache2/modules/mod_session_crypto.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so

User www-data
Group www-data
ServerTokens Prod
ServerSignature Off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
TypesConfig /etc/mime.types
AddType application/wasm .wasm
ErrorLog /var/log/ifshare/apache-error.log
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" ifshare
CustomLog /var/log/ifshare/apache-access.log ifshare
SSLSessionCache shmcb:/run/ifshare-web/ssl-cache(512000)
<Directory />
    AllowOverride None
    Require all denied
</Directory>
Include /etc/ifshare/apache/site.conf
