<VirtualHost *:80>
    ServerName 111.10.164.175
    DocumentRoot /var/www/ifshare/current
    DirectoryIndex index.html

    <Directory /var/www/ifshare>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        <FilesMatch "\.(html|json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <Location /static/>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </Location>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ifshare-error.log
    CustomLog ${APACHE_LOG_DIR}/ifshare-access.log combined
</VirtualHost>
