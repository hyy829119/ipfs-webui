<VirtualHost *:80>
    ServerName 111.10.164.175
    DocumentRoot /var/www/ifshare/current
    DirectoryIndex index.html

    Session On
    SessionCookieName ifshare_session path=/;httponly;samesite=strict
    SessionCryptoPassphraseFile /etc/apache2/ifshare/session.key
    SessionMaxAge 28800

    ProxyRequests Off
    ProxyPass /api/v0/ http://127.0.0.1:5001/api/v0/ connectiontimeout=5 timeout=600
    ProxyPassReverse /api/v0/ http://127.0.0.1:5001/api/v0/
    ProxyPass /ipfs/ http://127.0.0.1:8080/ipfs/ connectiontimeout=5 timeout=600
    ProxyPassReverse /ipfs/ http://127.0.0.1:8080/ipfs/
    ProxyPass /ipns/ http://127.0.0.1:8080/ipns/ connectiontimeout=5 timeout=600
    ProxyPassReverse /ipns/ http://127.0.0.1:8080/ipns/

    <LocationMatch "^/(api/v0(?:/|$)|ipfs(?:/|$)|ipns(?:/|$)|auth/session\.json$)">
        AuthType form
        AuthName IFShare
        AuthFormProvider file
        AuthUserFile /etc/apache2/ifshare/users
        <RequireAll>
            Require valid-user
            Require expr "req('Origin') == '' || req('Origin') == 'http://111.10.164.175:3000'"
        </RequireAll>
        Header always set Cache-Control "no-store"
    </LocationMatch>

    <Location /api/v0/>
        LimitRequestBody 0
        RequestHeader unset Origin
        SessionCookieRemove On
    </Location>

    <LocationMatch "^/(ipfs|ipns)/">
        SessionCookieRemove On
        # Content shares the UI host, but must never execute with its privileges.
        Header always set Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
        Header unset Cache-Control
        Header always set Cache-Control "private, no-store"
        AuthMerging And
        Require method GET HEAD
    </LocationMatch>

    <Location /auth/login>
        SetHandler form-login-handler
        AuthType form
        AuthName IFShare
        AuthFormProvider file
        AuthUserFile /etc/apache2/ifshare/users
        AuthFormLoginSuccessLocation /auth/session.json
        Require expr "req('Origin') == '' || req('Origin') == 'http://111.10.164.175:3000'"
        Header always set Cache-Control "no-store"
    </Location>

    <Location /auth/logout>
        SetHandler form-logout-handler
        AuthName IFShare
        Require expr "req('Origin') == '' || req('Origin') == 'http://111.10.164.175:3000'"
        Header always set Cache-Control "no-store"
    </Location>

    <Directory /var/www/ifshare>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        <FilesMatch "\.(html|json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <Location /static/>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </Location>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ifshare-error.log
    CustomLog ${APACHE_LOG_DIR}/ifshare-access.log combined
</VirtualHost>
