# Replace the previous IFShare virtual host; do not enable both on the same port.
# Keep your existing Listen, certificate files and host/port values.
# Required modules: ssl, proxy, proxy_http, headers.
# Example only: change files.example.com and the certificate paths before use.
<VirtualHost *:443>
    ServerName files.example.com
    SSLEngine On
    SSLCertificateFile /etc/ifshare/tls/server.crt
    SSLCertificateKeyFile /etc/ifshare/tls/server.key

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    ProxyPass / http://127.0.0.1:3001/ nocanon connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:3001/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # Node validates sessions for RPC, gateway and user administration.
    # No AuthType form / htpasswd / /auth/login rules are used here.
    LimitRequestBody 0
    ErrorLog ${APACHE_LOG_DIR}/ifshare-webuiapi-error.log
    # Do not log CID paths, RPC query parameters, cookies or credentials.
    CustomLog /dev/null combined
</VirtualHost>
