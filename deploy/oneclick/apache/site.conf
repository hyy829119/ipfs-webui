# Preserved on reinstallation; changes shipped in a later package are saved as .package-new.
<VirtualHost *:${IFSHARE_WEB_PORT}>
    ServerName ${IFSHARE_HOST}
    DocumentRoot /opt/ifshare/current/web
    DirectoryIndex index.html
    SSLEngine On
    SSLCertificateFile /etc/ifshare/tls/server.crt
    SSLCertificateKeyFile /etc/ifshare/tls/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    ErrorDocument 400 ${IFSHARE_ORIGIN}/

    Session On
    SessionCookieName ifshare_session_${IFSHARE_WEB_PORT} path=/;httponly;secure;samesite=strict
    SessionCryptoPassphraseFile /etc/ifshare/apache/session.key
    SessionMaxAge 28800
    ProxyRequests Off
    ProxyPass /api/v0/ http://127.0.0.1:${IFSHARE_API_PORT}/api/v0/ connectiontimeout=5 timeout=600
    ProxyPassReverse /api/v0/ http://127.0.0.1:${IFSHARE_API_PORT}/api/v0/
    ProxyPass /ipfs/ http://127.0.0.1:${IFSHARE_GATEWAY_PORT}/ipfs/ connectiontimeout=5 timeout=600
    ProxyPassReverse /ipfs/ http://127.0.0.1:${IFSHARE_GATEWAY_PORT}/ipfs/
    ProxyPass /ipns/ http://127.0.0.1:${IFSHARE_GATEWAY_PORT}/ipns/ connectiontimeout=5 timeout=600
    ProxyPassReverse /ipns/ http://127.0.0.1:${IFSHARE_GATEWAY_PORT}/ipns/

    <LocationMatch "^/(api/v0(?:/|$)|ipfs(?:/|$)|ipns(?:/|$)|auth/session\.json$)">
        AuthType form
        AuthName IFShare
        AuthFormProvider file
        AuthUserFile /etc/ifshare/apache/users
        <RequireAll>
            Require valid-user
            Require expr "req('Origin') == '' || req('Origin') == '${IFSHARE_ORIGIN}'"
        </RequireAll>
        Header always set Cache-Control "no-store"
    </LocationMatch>
    <Location /api/v0/>
        LimitRequestBody 0
        # External origin is checked above. Preserve a valid origin for Kubo's browser checks.
        RequestHeader set Origin "http://127.0.0.1:${IFSHARE_API_PORT}"
        RequestHeader unset Referer
        SessionCookieRemove On
    </Location>
    <LocationMatch "^/(ipfs|ipns)/">
        SessionCookieRemove On
        Header always set Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
        Header unset Cache-Control
        Header always set Cache-Control "private, no-store"
        AuthMerging And
        Require method GET HEAD
    </LocationMatch>
    <Location /auth/login>
        SetHandler form-login-handler
        AuthType form
        AuthName IFShare
        AuthFormProvider file
        AuthUserFile /etc/ifshare/apache/users
        AuthFormLoginSuccessLocation /auth/session.json
        Require expr "req('Origin') == '' || req('Origin') == '${IFSHARE_ORIGIN}'"
        Header always set Cache-Control "no-store"
    </Location>
    <Location /auth/logout>
        SetHandler form-logout-handler
        AuthName IFShare
        Require expr "req('Origin') == '' || req('Origin') == '${IFSHARE_ORIGIN}'"
        Header always set Cache-Control "no-store"
    </Location>
    Alias /IFShare-CA.crt /opt/ifshare/IFShare-CA.crt
    <Directory /opt/ifshare>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    <FilesMatch "\.(html|json|crt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <Location /static/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
</VirtualHost>
